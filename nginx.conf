http {
  include mime.types;
  sendfile on;
  gzip on;
  client_max_body_size 50M;

  upstream backend {
    server backend:4000;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 80;
    server_name _;
    index index.html index.htm;

    location / {
      root /front/build/; # <- directory where react bundle is stored
      try_files $uri /index.html; # <- serve index.html for any route
    }

    location /api {
      proxy_pass http://backend;
      proxy_ssl_verify off;
    }
  }
}

events {
  worker_connections 1024;
}
