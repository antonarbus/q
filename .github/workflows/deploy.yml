name: 'Deploy'

# Single workflow that handles both Terraform and Docker deployment
# Deployment target is determined by MASTER_DEPLOYS_TO_ENV in config/infrastructure.ts:
# - When set to 'prod': main/master branch deploys directly to production (single-stage workflow)
# - When set to 'dev': main/master branch deploys to dev, other environments use promotion workflow
on:
  push:
    branches:
      - main
      - master

  # Allow manual trigger in GitHub, useful to test workflow without pushing code
  workflow_dispatch:

jobs:
  deploy:
    name: 'Build and Deploy Application'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      previousImageBackend: ${{ steps.deploy.outputs.previousImageBackend }}

    steps:
      - name: 'Checkout repository code'
        uses: actions/checkout@v4

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 'Install dependencies'
        run: bun run install-ci

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/${{ needs.terraform.outputs.projectNumber }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@${{ needs.terraform.outputs.projectId }}.iam.gserviceaccount.com'

      - name: 'Docker Auth'
        run: gcloud auth configure-docker '${{ needs.terraform.outputs.region }}-docker.pkg.dev'

      - name: 'Build and Push Unified Docker Image'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ needs.terraform.outputs.region }}-docker.pkg.dev/${{ needs.terraform.outputs.projectId }}/${{ needs.terraform.outputs.artifactRegistryName }}/${{ needs.terraform.outputs.dockerImageName }}:${{ needs.terraform.outputs.environment }}
            ${{ needs.terraform.outputs.region }}-docker.pkg.dev/${{ needs.terraform.outputs.projectId }}/${{ needs.terraform.outputs.artifactRegistryName }}/${{ needs.terraform.outputs.dockerImageName }}:${{ github.sha }}

      - name: 'Deploy to Cloud Run'
        id: deploy
        run: bun deploy-scripts/cli.ts deploy-cloudrun --env ${{ needs.terraform.outputs.environment }} >> $GITHUB_OUTPUT
