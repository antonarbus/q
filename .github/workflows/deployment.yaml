name: CI and CD Pipeline to Cloud Run

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev
    types:
      - closed
env:
  PROJECT_ID: 'quotationapp-8014c'
  SERVICE_ACCOUNT: 'cloud-run-sa@quotationapp-8014c.iam.gserviceaccount.com'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/665701178658/locations/global/workloadIdentityPools/github/providers/github-repo-provider'
  ARTIFACTS_REGISTRY_FOLDER_NAME: 'cloud-run'

jobs:
  build-and-deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          echo "IMAGE_VERSION=${{github.ref_name}}" >> $GITHUB_ENV

      - name: Gcloud Auth
        id: gcloud-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          project_id: ${{env.PROJECT_ID}}
          service_account: ${{env.SERVICE_ACCOUNT}}
          workload_identity_provider: ${{env.WORKLOAD_IDENTITY_PROVIDER}}

      - name: Auth Container Registry
        id: container-registry-auth
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{steps.gcloud-auth.outputs.access_token}}

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Disable npm installation checks
        run: npm config set legacy-peer-deps true

      - name: Install dev dependencies
        run: npm run install_dev_deps

      - name: Install front dependencies
        run: npm run install_front

      - name: Install back dependencies
        run: npm run install_back

      - name: Run unit tests
        run: npm run test

      - name: Formatting check
        run: npm run prettier

      - name: Run TypeScript checks
        run: npm run tsc

      - name: Run ESlint
        run: npm run lint

      - name: Start dev server
        run: |
          npm run start &
          echo "Dev server is being launched"

      - name: Wait for dev server startup
        run: sleep 10

      - name: Wait for dev server to be ready
        run: |
          for i in {1..10}; do
            response=$(curl -k https://localhost:3000 -I -s)
            echo "$response" | grep "200 OK" && break
            echo "Waiting for server..."
            sleep 5
          done

      - name: Check if the service is accessible
        run: |
          if curl -k https://localhost:3000 -I -s | grep -q "HTTP/2 200"; then
            echo "app is reachable on dev server"
          else
            echo "app is NOT reachable on dev server"
            exit 1
          fi

      - name: Run Playwright tests
        run: npm run playwright

      - name: Stop server
        run: npm run stop

      - name: Build and push Docker image Backend
        id: build-push-back
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod.back
          push: true
          tags: us-central1-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.ARTIFACTS_REGISTRY_FOLDER_NAME}}/cloud-run-back:${{env.IMAGE_VERSION}}

      - name: Deploy to Cloud Run Backend
        id: deploy-cloud-run-back
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cloud-run-backend-${{env.IMAGE_VERSION}}
          image: us-central1-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.ARTIFACTS_REGISTRY_FOLDER_NAME}}/cloud-run-back:${{env.IMAGE_VERSION}}
          region: us-central1
          project_id: ${{env.PROJECT_ID}}
          flags: --port 4000 --allow-unauthenticated

      - name: Change backend stream NGINX config
        run: |
          DOMAIN=$(echo ${{steps.deploy-cloud-run-back.outputs.url}} | cut -d'/' -f3)
          sed -i 's|backend:4000|'${DOMAIN}'|g' ./nginx.conf
          sed -i 's|http://backend|https://'${DOMAIN}'|g' ./nginx.conf
          cat ./nginx.conf

      - name: Build and push Docker image Frontend
        id: build-push-front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod.front
          push: true
          tags: us-central1-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.ARTIFACTS_REGISTRY_FOLDER_NAME}}/cloud-run-front:${{env.IMAGE_VERSION}}

      - name: Deploy to Cloud Run Frontend
        id: deploy-cloud-run-front
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cloud-run-frontend-${{env.IMAGE_VERSION}}
          image: us-central1-docker.pkg.dev/${{env.PROJECT_ID}}/${{env.ARTIFACTS_REGISTRY_FOLDER_NAME}}/cloud-run-front:${{env.IMAGE_VERSION}}
          region: us-central1
          project_id: ${{env.PROJECT_ID}}
          flags: --port 80 --allow-unauthenticated

      - name: Test Cloud Run
        run: |
          curl "${{steps.deploy-cloud-run-back.outputs.url}}" -I -s | grep "HTTP/2 200"
          curl "${{steps.deploy-cloud-run-front.outputs.url}}" -I -s | grep "HTTP/2 200"
